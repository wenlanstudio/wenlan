name: Setup pnpm and Node.js
description: Install pnpm, Node.js, and project dependencies (skips postinstall scripts)

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.21.1'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    # file-icons 依赖的 lockfile 项记录成 git@github.com: 的 SSH 形态（pnpm 对
    # github: 速记的规范化产物）。runner 上没有 SSH key，fetch 直接失败；重写为
    # HTTPS 后走匿名克隆（fetch-by-SHA 公开仓可用）。
    - name: Rewrite git SSH URLs to HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      env:
        GITHUB_TOKEN: ${{ github.token }}
