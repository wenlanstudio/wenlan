name: Deploy usage telemetry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker + D1
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure D1 database
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "wenlan-usage") | (.uuid // .id)' | head -n 1)
          if [ -z "$id" ]; then
            npx wrangler d1 create wenlan-usage | tee d1-create.log
            id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' d1-create.log | head -n 1)
          fi
          if [ -z "$id" ]; then
            echo "D1 database id not found"
            exit 1
          fi
          echo "D1_ID=$id" >> "$GITHUB_ENV"
          sed -i "s/__D1_ID__/$id/" wrangler.toml

      - name: Apply D1 schema
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute wenlan-usage --remote --file=schema.sql

      - name: Deploy worker
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Show endpoint
        working-directory: services/telemetry-worker
        run: |
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)
          echo "Telemetry endpoint: ${url}/usage" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TELEMETRY_ENDPOINT=${url}/usage" >> "$GITHUB_ENV"
