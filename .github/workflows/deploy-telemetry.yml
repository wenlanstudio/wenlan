name: Deploy usage telemetry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker + D1
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure D1 database
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "wenlan-usage") | (.uuid // .id)' | head -n 1)
          if [ -z "$id" ]; then
            npx wrangler d1 create wenlan-usage | tee d1-create.log
            id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' d1-create.log | head -n 1)
          fi
          if [ -z "$id" ]; then
            echo "D1 database id not found"
            exit 1
          fi
          echo "D1_ID=$id" >> "$GITHUB_ENV"
          sed -i "s/__D1_ID__/$id/" wrangler.toml

      - name: Apply D1 schema
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute wenlan-usage --remote --file=schema.sql

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            for candidate in "wenlanstudio" "wenlanstudio-${CLOUDFLARE_ACCOUNT_ID:0:8}"; do
              code=$(curl -sS -o subdomain.json -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H 'Content-Type: application/json' \
                --data "{\"subdomain\":\"$candidate\"}" "$api")
              if [ "$code" = "200" ]; then
                sub="$candidate"
                break
              fi
            done
          fi
          if [ -z "$sub" ]; then
            echo "workers.dev subdomain unavailable"
            exit 1
          fi
          echo "SUBDOMAIN=$sub" >> "$GITHUB_ENV"

      - name: Deploy worker
        working-directory: services/telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Verify endpoint
        run: |
          endpoint="https://wenlan-usage.${SUBDOMAIN}.workers.dev/usage"
          echo "Telemetry endpoint: $endpoint" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -m 20 \
            -X POST -H 'Content-Type: application/json' --data '{}' "$endpoint"
