name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) self-lints via .github/workflows/muya-lint.yml.
    # Skip the desktop lint+typecheck on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      # 离线帮助文档：挡住「改了快照忘了重建页面」与「本仓 frontmatter 改了没同步」。
      # 独立发布 CI 里没有兄弟仓，脚本会按已提交的快照校验，不会因缺源而失败。
      - name: Check offline help docs are in sync
        run: pnpm help:docs:check
