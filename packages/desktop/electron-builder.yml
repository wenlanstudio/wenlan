appId: io.github.quqingyuan.wenlan
productName: Wenlan Studio
directories:
  buildResources: build
  output: ../../dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # ================================
  # Do not bundle these files
  # ================================
  - '!node_modules/**/*.js.map'
  - '!node_modules/**/*.cjs.map'
  - '!node_modules/**/*.mjs.map'
  - '!node_modules/**/*.ts.map'
  - '!node_modules/@vscode/ripgrep/{jsconfig.json,*.md,LICENSE}'
  - '!node_modules/@vscode/ripgrep/lib/download.js'
  - '!node_modules/@vscode/ripgrep/lib/postinstall.js'
  - '!node_modules/ced/vendor'
  # Large source files
  - '!node_modules/mermaid/dist/mermaid.js'
  - '!node_modules/mermaid/dist/mermaid.min.js'
  - '!node_modules/mermaid/dist/mermaid.esm.min.mjs'
  - '!node_modules/katex/dist/katex.min.js'
  - '!node_modules/katex/dist/katex.mjs'
  # Don't bundle Linux build files
  - '!node_modules/ced/build/Release/compact_enc_det.a'
  - '!node_modules/**/{*.vcxproj,*.vcxproj.filters}'
  - '!node_modules/**/build/Release/{*.lib,*.exp,*.ilk,*.pdb,*.iobj,*.ipdb}'
  - '!node_modules/**/build/Release/obj'
  # Do not bundle development related files
  - '!eslint.config.js'
  - '!jsconfig.json'
  - '!docs/*'
  # Runtime assets are copied via extraResources below; keep them out of the asar.
  - '!resources/**'
extraResources:
  - from: build/icons
    to: icons # ends up at resources/icons/
    filter:
      - '*.ico'
  # main/ipc/md2slides.ts resolves vendored assets as
  # process.resourcesPath/resources/md2slides, so they must land one level
  # deeper than the default extraResources root.
  - from: resources
    to: resources
    filter:
      - '**/*'
  - from: static
    to: static
    filter:
      - '**/*'
      - '!locales/**/!(*.min).json'
npmRebuild: false
electronLanguages: # Keep Chromium/AppKit locales for the UI languages Wenlan Studio supports
  # Values must cover both spellings: "xx-YY" .pak files on Windows/Linux and
  # "xx_YY" .lproj bundles on macOS. Keeping them lets OS-provided strings
  # (e.g. the macOS Window management items) localize on non-English systems;
  # the in-built locales are still the source for the app's own UI.
  - en-US
  - en
  - de
  - es
  - fr
  - ja
  - ko
  - nl
  - pt-BR
  - pt-PT
  - pt_BR
  - pt_PT
  - ru
  - tr
  - zh-CN
  - zh-TW
  - zh_CN
  - zh_TW

electronFuses:
  # Node's CLI parser inside Electron rejects `--debug` (DEP0062, exit 9) before
  # Wenlan Studio can read it (#5409). With this fuse off the packaged app ignores
  # Node's inspector flags, so `--debug` reaches Wenlan Studio.
  enableNodeCliInspectArguments: false
  # Flipping a fuse rewrites the Electron Framework binary, invalidating the
  # ad-hoc signature its linker wrote. Unsigned macOS arm64 builds are then
  # killed on launch (Code Signature Invalid), so re-sign ad-hoc after flipping.
  resetAdHocDarwinSignature: true

asarUnpack:
  - resources/**
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: markdown
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mmd
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdown
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdtxt
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdtext
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
win:
  executableName: wenlan
  artifactName: 'wenlan-win-${arch}-${version}.${ext}'
  target:
    - target: 'nsis'
    - target: 'zip'
  icon: static/icon.ico
nsis:
  artifactName: 'wenlan-win-${arch}-${version}-setup.${ext}'
  shortcutName: 文览
  uninstallDisplayName: 文览
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: windows/installer.nsh
mac:
  artifactName: 'wenlan-mac-${arch}-${version}.${ext}'
  entitlementsInherit: build/mac/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: static/icon.icns
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: 'wenlan-mac-${arch}-${version}.${ext}'
  contents:
    - x: 410
      y: 240
      type: 'link'
      path: '/Applications'
    - x: 130
      y: 240
      type: 'file'
linux:
  artifactName: 'wenlan-linux-${version}.${ext}'
  executableName: 'wenlan'
  description: 'A Markdown editor with document, column, slide, present and A4 paper views.'
  maintainer: 'Wenlan Studio Contributors'
  category: 'Office;TextEditor;Utility'
  mimeTypes:
    - 'text/markdown'
  icon: 'static/icon.png'
  desktop:
    entry:
      StartupWMClass: 'wenlan'
      Keywords: 'wenlan;markdown;'
  target:
    - AppImage
    - snap
    - deb
    - rpm
    - tar.gz
  fileAssociations:
    - ext: 'md'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'markdown'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mmd'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdown'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdtxt'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdtext'
      name: 'Markdown'
      description: 'Markdown document'
